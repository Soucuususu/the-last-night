
name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  WEB2APK_REPO: bhawan-kavinda/Web2APK
  WEB2APK_REF: 'latest'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Check config files
        run: |
          for f in app.json icon.png; do
            if [ ! -f ".github/$f" ]; then
              echo "::warning::.github/$f is missing - Web2APK's default is used instead."
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Web2APK
        run: |
          REPO_URL="https://github.com/$WEB2APK_REPO.git"
          REF="$WEB2APK_REF"

          if [ -z "$REF" ] || [ "$REF" = "latest" ]; then
            REF=$(git ls-remote --tags --refs --sort=-v:refname "$REPO_URL" 'v*' |
              sed 's#.*refs/tags/##' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1)

            if [ -z "$REF" ]; then
              echo "::error::Nenhuma versão oficial encontrada."
              exit 1
            fi
          fi

          echo "Usando Web2APK: $REF"
          git clone --depth 1 --branch "$REF" "$REPO_URL" "$RUNNER_TEMP/Web2APK"
          echo "W2A_DIR=$RUNNER_TEMP/Web2APK" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          WEB_DIR: ${{ github.workspace }}
          CONFIG_DIR: ${{ github.workspace }}/.github
          OUT_DIR: ${{ github.workspace }}/output
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node "$W2A_DIR/scripts/build.mjs"

      - name: Print APK certificate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find output -maxdepth 1 -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK encontrado na pasta output."
            exit 1
          fi

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK/build-tools" ]; then
            echo "::error::Android SDK Build Tools não encontrados."
            exit 1
          fi

          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner |
            sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner não encontrado."
            exit 1
          fi

          echo "APK analisado: $APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: output/*.apk
          if-no-files-found: error
